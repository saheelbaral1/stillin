<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:20px 24px;display:flex;gap:12px}
.sw{flex:1}.chip{height:74px;border-radius:12px;border:1px solid var(--line)}
.nm{font-family:var(--font-body);font-size:11px;color:var(--ink);margin-top:8px}.hx{font-family:var(--font-body);font-size:10.5px;color:var(--ink-3);margin-top:2px}</style>
</head><body><div class="w">
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="nm">ink</div><div class="hx">#0A0A0A</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="nm">ink-2</div><div class="hx">#525252</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="nm">ink-3</div><div class="hx">#8A8A8A</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="nm">surface-2</div><div class="hx">#FAFAF8</div></div>
  <div class="sw"><div class="chip" style="background:var(--line)"></div><div class="nm">line</div><div class="hx">#E7E5E0</div></div>
  <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="nm">bg / surface</div><div class="hx">#FFFFFF</div></div>
</div></body></html>
