<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:20px 24px;display:flex;gap:16px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-pill);font-family:var(--font-body);font-weight:500;font-size:14px;cursor:pointer}</style>
</head><body><div class="w">
  <div class="pill" style="background:#fff;border:1.5px solid var(--line);color:var(--ink-2)"><span style="font-size:17px">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>England</div>
  <div class="pill" style="background:#fff;border:1.5px solid var(--ink);color:var(--ink)"><span style="font-size:17px">🇧🇷</span>Brazil</div>
  <div style="display:flex;flex-direction:column;gap:4px"><div class="t-meta">rest</div><div class="t-meta" style="color:var(--ink-2)">hover →</div></div>
  <div style="border-left:1px solid var(--line);padding-left:20px">
    <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;background:var(--hanging-fill);">
      <span style="width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block"></span>
      <span style="font-family:var(--font-body);font-weight:500;font-size:10.5px;letter-spacing:.18em;color:#fff">LIVE</span>
    </span>
    <div class="t-meta" style="margin-top:8px">live pill · pulsing dot + ring</div>
  </div>
</div></body></html>
