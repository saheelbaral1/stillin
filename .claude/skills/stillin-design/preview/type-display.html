<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .w{padding:30px 34px 32px;display:flex;flex-direction:column}
  /* Status label: Saira Condensed 900, flat solid gold. The power is the scale
     and weight alone — no shadow, no bevel, no texture. */
  .board{
    font-family:var(--font-display);font-weight:900;font-size:78px;line-height:0.82;
    letter-spacing:-0.02em;text-transform:uppercase;color:#C9A84C;
  }
  .cap{font-family:var(--font-body);font-weight:500;font-size:11px;letter-spacing:.03em;color:var(--ink-3)}
  /* Heading: clean modern sans, 600 — contrasts against the condensed display. */
  .heading{font-family:var(--font-body);font-weight:600;font-size:32px;line-height:1.0;letter-spacing:-0.02em;color:var(--ink)}
</style>
</head><body>
  <div class="w">
    <div class="board">Hanging On</div>
    <div class="cap" style="margin-top:18px">Saira Condensed · 900 · status labels only · flat #C9A84C</div>

    <div style="height:30px"></div>

    <div class="heading">Which team are you following?</div>
    <div class="cap" style="margin-top:14px">DM Sans · 600 · headings &amp; everything that isn't a status label</div>
  </div>
</body></html>
