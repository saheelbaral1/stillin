<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:20px 24px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:1px solid rgba(201,168,76,.35)}
.flag{font-size:20px;line-height:1}
.team{font-family:var(--font-body);font-weight:600;font-size:13px;letter-spacing:.04em;color:#fff;flex:1}
.lab{font-family:var(--font-display);font-weight:900;font-size:16px;text-transform:uppercase;color:#fff;letter-spacing:.01em}</style>
</head><body><div class="w">
  <div class="row" style="background:#14532D"><span class="flag">🇧🇷</span><span class="team">Brazil</span><span class="lab">Through</span></div>
  <div class="row" style="background:#92400E"><span class="flag">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span><span class="team">England</span><span class="lab">Hanging On</span></div>
  <div class="row" style="background:#7F1D1D"><span class="flag">🇫🇷</span><span class="team">France</span><span class="lab">In Danger</span></div>
  <div class="row" style="background:#1F2937"><span class="flag">🇺🇸</span><span class="team">USA</span><span class="lab">Out</span></div>
</div></body></html>
