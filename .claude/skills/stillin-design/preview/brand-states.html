<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:20px 24px;display:flex;gap:12px}
.s{flex:1;position:relative;overflow:hidden;border-radius:var(--r-card);border:1px solid rgba(201,168,76,.4);padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.depth{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.2) 100%)}
.flag{position:relative;font-size:28px;line-height:1}
.tm{position:relative;font-family:var(--font-body);font-weight:500;font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.85);text-transform:uppercase}
.lab{position:relative;font-family:var(--font-display);font-weight:900;font-size:18px;line-height:.86;text-transform:uppercase;color:#fff;text-align:center}</style>
</head><body><div class="w">
  <div class="s" style="background:#14532D"><div class="depth"></div><span class="flag">🇧🇷</span><span class="tm">Brazil</span><span class="lab">Through</span></div>
  <div class="s" style="background:#92400E"><div class="depth"></div><span class="flag">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span><span class="tm">England</span><span class="lab">Hanging On</span></div>
  <div class="s" style="background:#7F1D1D"><div class="depth"></div><span class="flag">🇫🇷</span><span class="tm">France</span><span class="lab">In Danger</span></div>
  <div class="s" style="background:#1F2937"><div class="depth"></div><span class="flag">🇺🇸</span><span class="tm">USA</span><span class="lab">Out</span></div>
</div></body></html>
