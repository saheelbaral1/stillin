<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.field{position:relative;height:52px}
.field input{width:100%;height:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);background:#fff;border-radius:var(--r-input);outline:none;box-sizing:border-box}
.ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:flex}</style>
</head><body><div class="w">
  <div class="field">
    <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <input value="" placeholder="Search your team…" style="padding:0 16px 0 44px;border:2px solid var(--ink);box-shadow:0 0 0 4px var(--gold-soft)" readonly>
  </div>
  <div style="display:flex;gap:8px">
    <input value="" placeholder="your@email.com" style="flex:1;height:46px;padding:0 14px;font-family:var(--font-body);font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:11px;outline:none;box-sizing:border-box" readonly>
    <button style="height:46px;padding:0 18px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-family:var(--font-body);font-weight:500;font-size:14px">Notify me</button>
  </div>
</div></body></html>
