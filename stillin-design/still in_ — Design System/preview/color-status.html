<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:18px 24px;display:flex;gap:12px}
.sw{flex:1}.chip{position:relative;overflow:hidden;height:80px;border-radius:var(--r-card);border:1px solid rgba(201,168,76,.4);display:flex;align-items:center;justify-content:center}
.depth{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.2) 100%)}
.lbl{position:relative;font-family:var(--font-display);font-weight:900;font-size:20px;text-transform:uppercase;color:#fff;letter-spacing:-.01em;line-height:.86;text-align:center}
.nm{font-family:var(--font-body);font-weight:500;font-size:10.5px;color:var(--ink);margin-top:8px;text-align:center}.hx{font-family:var(--font-body);font-size:10px;color:var(--ink-3);text-align:center;margin-top:1px}</style>
</head><body><div class="w">
  <div class="sw"><div class="chip" style="background:#14532D"><div class="depth"></div><span class="lbl">Through</span></div><div class="nm">THROUGH</div><div class="hx">#14532D</div></div>
  <div class="sw"><div class="chip" style="background:#92400E"><div class="depth"></div><span class="lbl">Hanging<br>On</span></div><div class="nm">HANGING ON</div><div class="hx">#92400E</div></div>
  <div class="sw"><div class="chip" style="background:#7F1D1D"><div class="depth"></div><span class="lbl">In<br>Danger</span></div><div class="nm">IN DANGER</div><div class="hx">#7F1D1D</div></div>
  <div class="sw"><div class="chip" style="background:#1F2937"><div class="depth"></div><span class="lbl">Out</span></div><div class="nm">OUT</div><div class="hx">#1F2937</div></div>
</div></body></html>
