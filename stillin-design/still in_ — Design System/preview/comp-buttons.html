<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:22px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{height:50px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;border-radius:var(--r-btn);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer}
/* gold→purple gradient text = the AI cue */
.ai{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-weight:600;font-size:13.5px;background:var(--ai-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}</style>
</head><body><div class="w">
  <button class="btn" style="background:var(--gold);color:#1A1306;padding:0 22px;box-shadow:var(--shadow-card)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    Share this result</button>
  <button class="btn" style="background:var(--ink);color:#fff;padding:0 22px;font-weight:500">Notify me</button>
  <span class="ai"><span>✦</span> Wait, what does this mean?</span>
</div></body></html>
