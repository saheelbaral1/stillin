<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#fff}.w{padding:22px 24px;display:flex;gap:18px;align-items:center}
.box{width:78px;height:62px;background:var(--surface-2);border:1px solid var(--line)}
.nm{font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--ink);margin-top:9px;text-align:center}
.hx{font-family:var(--font-body);font-size:10px;color:var(--ink-3);text-align:center}</style>
</head><body><div class="w">
  <div><div class="box" style="border-radius:var(--r-pill)"></div><div class="nm">pill</div><div class="hx">999</div></div>
  <div><div class="box" style="border-radius:var(--r-input)"></div><div class="nm">input</div><div class="hx">14</div></div>
  <div><div class="box" style="border-radius:var(--r-btn)"></div><div class="nm">button</div><div class="hx">13</div></div>
  <div><div class="box" style="border-radius:var(--r-card)"></div><div class="nm">card</div><div class="hx">12</div></div>
  <div style="border-left:1px solid var(--line);padding-left:26px;display:flex;gap:24px">
    <div><div class="box" style="border:none;box-shadow:var(--shadow-card);border-radius:12px"></div><div class="nm">card</div><div class="hx">lift off page</div></div>
    <div><div class="box" style="border:none;box-shadow:var(--shadow-hero);border-radius:12px"></div><div class="nm">hero</div><div class="hx">status card</div></div>
  </div>
</div></body></html>
