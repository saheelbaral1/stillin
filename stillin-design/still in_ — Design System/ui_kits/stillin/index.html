<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Stillin" name="App UI Kit — still in?" subtitle="Interactive: team search → live status card (390px)" viewport="422x560" -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>still in? — App UI Kit</title>
<link rel="icon" href="../../assets/favicon.ico" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background:
      radial-gradient(60% 50% at 50% 0%, #FBFAF7 0%, #F1EFEA 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px;
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* device frame */
  .phone {
    width: 422px;
    background: #0A0A0A;
    border-radius: 56px;
    padding: 16px;
    box-shadow: 0 50px 100px -30px rgba(10,10,10,0.45), 0 0 0 1px rgba(0,0,0,0.6);
  }
  .phone-screen {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 42px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
  }
  .phone-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .phone-scroll::-webkit-scrollbar { width: 0; }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: var(--ink);
    opacity: 0.85; z-index: 30;
  }

  .pill:hover { border-color: var(--ink) !important; color: var(--ink) !important; }
  .pill:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="Wordmark.jsx"></script>
  <script type="text/babel" src="SearchScreen.jsx"></script>
  <script type="text/babel" src="StatusCard.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
