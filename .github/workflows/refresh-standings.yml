name: Refresh WC Standings

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger standings refresh
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -H "Authorization: Bearer $SECRET" https://stillin.vercel.app/api/cron/refresh
