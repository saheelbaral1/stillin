name: Refresh WC Standings

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger standings refresh
        run: curl -f -H "Authorization: Bearer $CRON_SECRET" https://stillin.vercel.app/api/cron/refresh
